<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-header bg-danger text-white text-center">
                <h4>Edit Profile</h4>
            </div>
            <div class="card-body p-3">
                <form th:action="@{/update-profile}" th:object="${restaurant}" method="post">
                    <div class="mb-2"><label class="form-label">Restaurant Name:</label><input type="text" class="form-control" th:field="*{name}"></div>
                    <div class="mb-2"><label class="form-label">Address:</label><input type="text" class="form-control" th:field="*{address}"></div>
                    <div class="mb-2"><label class="form-label">Phone:</label><input type="text" class="form-control" th:field="*{phone}"></div>
                    <div class="mb-2"><label class="form-label">Email:</label><input type="email" class="form-control" th:field="*{email}"></div>
                    <div class="mb-2"><label class="form-label">Cuisine Type:</label><input type="text" class="form-control" th:field="*{cuisine}"></div>
                    <div class="mb-2"><label class="form-label">Website:</label><input type="url" class="form-control" th:field="*{website}"></div>
                    <button class="btn btn-danger w-100 mt-3" type="submit">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
